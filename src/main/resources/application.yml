server:
  servlet:
    context-path: /gestao-funcionarios/api
spring:
  datasource:
    url: jdbc:h2:mem:gestao-funcionarios
    driver-class-name: org.h2.Driver
    username: admin
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.H2Dialect
  swagger:
    springdoc:
      api-docs:
        path: /gestao-funcionarios/api/v3/api-docs
      swagger-ui:
        path: /gestao-funcionarios/api/swagger-ui.html